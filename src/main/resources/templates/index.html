<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warehouse Inventory System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/index.js}" defer></script>
</head>
<body>
<div class="container">
    <h1>📦 Warehouse Inventory Dashboard</h1>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <div class="form-row">
        <div class="form-container">
            <h2>1. Add Product to Catalog</h2>

            <form th:action="@{/web/products/add}"
                  th:object="${newProduct}"
                  method="post">

                <div class="form-group">
                    <label for="new-product-id">ID (SKU):</label>
                    <input type="text" id="new-product-id" th:field="*{id}" required>
                </div>

                <div class="form-group">
                    <label for="new-product-name">Name:</label>
                    <input type="text" id="new-product-name" th:field="*{name}" required>
                </div>

                <div class="form-group">
                    <label for="new-product-description">Description:</label>
                    <input type="text" id="new-product-description" th:field="*{description}">
                </div>

                <button type="submit" class="btn btn-primary">Create Product</button>
            </form>
        </div>

        <div class="form-container batch-container">
            <h2>2. Add Inventory Batch</h2>

            <form th:action="@{/web/products/batches/add}" method="post">
                <div class="form-group">
                    <label for="productId">Select Product:</label>
                    <select id="productId" name="productId" required>
                        <option value="" disabled selected>-- Select a Product --</option>
                        <option th:each="p : ${products}"
                                th:value="${p.id}"
                                th:text="|${p.name} (${p.id})|"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" required>
                </div>

                <div class="form-group">
                    <label for="expirationDate">Expiration Date:</label>
                    <input type="date" id="expirationDate" name="expirationDate">
                </div>

                <button type="submit" class="btn btn-primary btn-batch">Add Batch</button>
            </form>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Total Qty</th>
            <th>Batches (Qty &amp; Exp)</th>
            <th>Quick Sell</th>
            <th class="actions-heading">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${products.empty}">
            <td colspan="7" class="empty-message">
                No products in catalog. Add one above!
            </td>
        </tr>

        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1001</td>
            <td th:text="${product.name}">Test</td>
            <td th:text="${product.description}">Desc</td>

            <td th:text="${product.getTotalQuantity()}"
                th:classappend="${product.getTotalQuantity() < 5} ? 'danger-text' : ''"
                class="total-quantity">
                10
            </td>

            <td>
                <ul class="batch-list">
                    <li th:each="batch : ${product.batches}">
                        <span th:text="${batch.quantity} + 'x'"></span>

                        <span th:if="${batch.expirationDate}"
                              th:text="' (Exp: ' + ${batch.expirationDate} + ')'"
                              th:style="${batch.expirationDate.isBefore(T(java.time.LocalDate).now())} ? 'color: red;' : ''"></span>

                        <span th:unless="${batch.expirationDate}">(No Exp)</span>
                    </li>

                    <li th:if="${product.batches.empty}">
                        <em>Out of stock</em>
                    </li>
                </ul>
            </td>

            <td>
                <form th:action="@{/web/products/sell}"
                      method="post"
                      class="sell-form">
                    <input type="hidden" name="id" th:value="${product.id}">

                    <input type="number"
                           name="amount"
                           class="sell-input"
                           min="1"
                           th:max="${product.getTotalQuantity()}"
                           value="1"
                           required>

                    <button type="submit"
                            class="btn-sell"
                            th:disabled="${product.getTotalQuantity() <= 0}">
                        Sell
                    </button>
                </form>
            </td>

            <td class="actions-cell">
                <div class="dropdown">
                    <button type="button"
                            class="dropbtn"
                            aria-label="Product actions"
                            aria-expanded="false">
                        &#8942;
                    </button>

                    <div class="dropdown-content">
                        <a th:href="@{/web/products/edit/{id}(id=${product.id})}">
                            ✏️ Edit Product
                        </a>

                        <form th:action="@{/web/products/delete}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this product and all its batches?');">
                            <input type="hidden" name="id" th:value="${product.id}">
                            <button type="submit" class="text-danger">🗑️ Delete</button>
                        </form>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
