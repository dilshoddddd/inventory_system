<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product - Warehouse System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container edit-container">
    <h1>✏️ Edit Product</h1>

    <form th:action="@{/web/products/edit/{id}(id=${product.id})}"
          th:object="${product}"
          method="post">

        <div class="form-group">
            <label for="id">ID (Cannot be changed):</label>
            <input type="text" id="id" th:field="*{id}" readonly>
        </div>

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description" th:field="*{description}">
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
